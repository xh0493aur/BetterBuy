<!DOCTYPE html>
<html lang="zh-CN">
<!-- 从 2026-11-14 抓取的真实 Steam 商品页中摘录的评测摘要区块（结构一致，数值未修改） -->
<body>
<div class="game_area_purchase_game">
  <div class="discount_final_price">¥ 48.00</div>
</div>

<div class="user_reviews" id="userReviews">
  <a class="user_reviews_summary_row" href="#app_reviews_hash"
     data-tooltip-html="过去 30 天内的 5,728 篇用户评测中有 98% 为好评。">
    <div class="subtitle column">最近评测：</div>
    <div class="summary column">
      <span class="game_review_summary positive">好评如潮</span> (5,728)
    </div>
  </a>
  <a class="user_reviews_summary_row" href="#app_reviews_hash"
     data-tooltip-html="您语言的 201,909 篇用户评测中有 97% 为好评。">
    <div class="subtitle column">简体中文评测：</div>
    <div class="summary column">
      <span class="game_review_summary positive">好评如潮</span> (201,909)
    </div>
  </a>
  <a class="user_reviews_summary_row" href="#app_reviews_hash">
    <div class="subtitle column">所有评测：</div>
    <div class="summary column">
      <span class="responsive_reviewdesc_short">
        <span class="desc_short">简体中文评测</span>
        <span class="game_review_summary positive">好评如潮</span>
        (97% of 201,909)
      </span>
    </div>
  </a>
</div>
</body>
</html>
